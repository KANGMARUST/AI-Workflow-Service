services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      QUOTE_DATA_DIR: /app/storage
      QUOTE_SAMPLE_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
      - quote-storage:/app/storage
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
volumes:
  quote-storage:
